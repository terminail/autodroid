[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "autodroid-trader-tradescripts"
version = "1.0.0"
description = "Autodroid Tradescript Engine API"
authors = [{ name = "Autodroid Team" }]
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.104.1",
    "uvicorn==0.24.0",
    "uiautomator2>=3.0.0",
    "python-multipart==0.0.6",
    "pydantic==2.10.5",
    "pydantic-settings==2.1.0",
    "python-dotenv==1.0.0",
    "peewee==3.17.1",
    "requests==2.31.0",
    "zeroconf==0.111.0",
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",
    "psutil==5.9.8",
    "qrcode[pil]==7.4.2",
    "pyyaml==6.0.1",
]

[project.scripts]
autodroid-tradescripts = "tradescripts.main:main"

[tool.setuptools.packages.find]
where = ["."]
